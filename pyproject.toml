[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-trading-analyst"
version = "0.1.0"
description = "Autonomous ReAct trading analyst that decides, paper-trades and remembers (paper trading only)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Alejandro Camerlengo" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "pip-audit>=2.7",
    "bandit>=1.7",
]
# Market data, indicators, anomaly signals and the P-09 research client.
tools = [
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
]
# Multi-provider LLM abstraction (function calling).
llm = [
    "openai>=1.40",
    "anthropic>=0.34",
    "google-genai>=1.0",
]
# Persistence and episodic memory (PostgreSQL + pgvector).
memory = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]
# Agent and portfolio API.
api = [
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
]
# Airflow DAG that triggers analysis cycles.
orchestration = [
    "apache-airflow>=3,<4",
]
# GCP artifact store.
cloud = [
    "google-cloud-storage>=2.18",
]
all = [
    "autonomous-trading-analyst[tools,llm,memory,api,orchestration,cloud]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autonomous_trading_analyst = ["py.typed"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# pytest relies on plain `assert` statements.
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["autonomous_trading_analyst"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "yfinance",
    "pandas.*",
    "pandas",
]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "issue_0: Day 0 setup and scaffolding",
    "issue_1: CI workflow (GitHub Actions)",
    "issue_2: Settings and domain models",
    "issue_3: Market data provider (Yahoo + fake)",
    "issue_4: Technical indicators",
    "issue_5: Anomaly signals (P-06 style)",
    "issue_6: P-09 research client",
    "issue_7: Tool registry and JSON schemas",
    "issue_8: LLM client abstraction & fake",
    "issue_9: LLM providers & cost tracking",
    "issue_10: Scratchpad & trace recorder",
    "issue_11: ReAct loop & signal contract",
    "issue_12: Deterministic risk guardrails",
    "issue_13: Paper broker & portfolio accounting",
    "issue_14: Decision & trace persistence",
    "issue_15: Episodic memory with pgvector",
    "issue_16: Outcome reflection",
    "issue_17: Analysis cycle orchestrator",
    "issue_18: Performance metrics",
    "issue_19: Baseline strategies",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["autonomous_trading_analyst"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

# ---------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
